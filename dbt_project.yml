name: dbt_project_template
version: 1.0.0
config-version: 2

profile: dbt_project_template

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages
  - logs
  - site

models:
  dbt_project_template:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table

seeds:
  dbt_project_template:
    +schema: raw
    +quote_columns: false
